<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima e Qualidade do Ar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-light">
    <div class="container mt-4">
        <div class="row" id="weather-container">
            <!-- Os cards do clima serão adicionados dinamicamente aqui -->
        </div>
        
        <!-- Card da Qualidade do Ar -->
        <div class="row mt-4">
            <div class="col-md-6 mx-auto">
                <div class="card p-3 shadow">
                    <h4>Qualidade do Ar (São Paulo)</h4>
                    <h2 id="aqi">77</h2>
                    <p id="aqi-status">Moderado</p>
                    <p>Ozônio (O₃): <span id="ozone">98 µg/m³</span></p>
                    <p>PM 2.5: <span id="pm25">14.71 µg/m³</span></p>
                    <p>PM 10: <span id="pm10">26.35 µg/m³</span></p>
                    <p>CO: <span id="co">439.92 µg/m³</span></p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const apiKey = '87b2da541e9ed47af6ca64c13af48511';
        const cities = ['São Paulo', 'Rio de Janeiro', 'Belo Horizonte', 'Curitiba', 'Porto Alegre'];
        
        async function fetchWeather(city) {
            try {
                const weatherUrl = `https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&lang=pt_br&appid=${apiKey}`;
                const response = await axios.get(weatherUrl);
                
                return {
                    city: city,
                    temperature: `${Math.round(response.data.main.temp)}°C`,
                    description: response.data.weather[0].description,
                    feels_like: `${Math.round(response.data.main.feels_like)}°C`,
                    wind_speed: `${response.data.wind.speed} km/h`,
                    humidity: `${response.data.main.humidity}%`
                };
            } catch (error) {
                console.error(`Erro ao buscar dados do clima para ${city}:`, error);
                return null;
            }
        }

        async function displayWeather() {
            const weatherContainer = document.getElementById('weather-container');
            weatherContainer.innerHTML = '';

            const weatherData = await Promise.all(cities.map(fetchWeather));

            weatherData.forEach(data => {
                if (data) {
                    const card = `
                        <div class="col-md-4 mb-3">
                            <div class="card p-3 shadow">
                                <h4>${data.city}</h4>
                                <h2>${data.temperature}</h2>
                                <p>${data.description}</p>
                                <p>Sensação térmica: ${data.feels_like}</p>
                                <p>Vento: ${data.wind_speed}</p>
                                <p>Umidade: ${data.humidity}</p>
                            </div>
                        </div>`;
                    weatherContaine
